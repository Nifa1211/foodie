apiVersion: v1
kind: Namespace
metadata:
  name: foodie
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: foodie
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: foodie
spec:
  selector: {app: redis}
  ports: [{port: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-service
  namespace: foodie
spec:
  replicas: 1
  selector:
    matchLabels: {app: restaurant-service}
  template:
    metadata:
      labels: {app: restaurant-service}
    spec:
      containers:
        - name: restaurant-service
          image: foodie/restaurant:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          readinessProbe:
            httpGet: {path: /health, port: 3001}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 3001}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 192Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: restaurant-service
  namespace: foodie
  labels:
    app: restaurant-service
    metrics: "true"
spec:
  selector: {app: restaurant-service}
  ports:
    - name: http
      port: 3001
      targetPort: http
---
